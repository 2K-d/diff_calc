name: CI Pipeline

on: 
  push:
    tags:
      - '*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo build --release
      - uses: softprops/action-gh-release@v3
        with:
          files: target/release/diff_calc

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo build --release
      - uses: softprops/action-gh-release@v3
        with:
          files: target/release/diff_calc.exe
          
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: |
          cargo build --release
          cp target/release/diff_calc target/release/diff_calc-arm64

      - run: |
          rustup target add x86_64-apple-darwin
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 cargo build --release --target x86_64-apple-darwin
          cp target/x86_64-apple-darwin/release/diff_calc target/release/diff_calc-x86_64
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/diff_calc-arm64
            target/release/diff_calc-x86_64
